name: Feature request
description: Propose a focused, evidence-backed improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for proposing an improvement. Explain the user problem before the implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or operational gap is not addressed today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change and an example interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: evidence
    attributes:
      label: Standards, formats, or evidence
      description: Link authoritative specifications or provide sanitized examples where relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request preserves the project's offline-first scope.
          required: true
